# Конфигурация nginx для cs2casino.space
# Применяется автоматически через deploy.sh

server {
    listen 80;
    listen [::]:80;
    server_name cs2casino.space www.cs2casino.space;

    access_log /var/log/nginx/cs2casino.space.access.log;
    error_log /var/log/nginx/cs2casino.space.error.log;

    root /var/www/cs2casino.space/web;
    index index.html;

    # API — проксируем на Node.js
    location ~ ^/(auth|me|users|tasks|firms|health) {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
